<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dadde2 0%, #e2dede 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-shell {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px 24px;
      min-width: 320px;
      max-width: 380px;
      width: 100%;
      margin: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @media (max-width: 500px) {
      .app-shell {
        min-width: unset;
        max-width: 98vw;
        padding: 16px 4px;
      }
    }
  </style>
</head>
<body>
  
    <app-root></app-root>
  
</body>
</html>
